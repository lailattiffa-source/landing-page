<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page CI/CD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      color: #333;
    }
    header {
      background: #ea99dd;
      color: white;
      padding: 80px 20px;
    }
    header h1 { margin: 0 0 10px; font-size: 2.5rem; }
    section { padding: 50px 20px; max-width: 700px; margin: auto; }
    .tombol {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: white;
      color: #ea99dd;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    footer {
      background: #f2f2f2;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Selamat Datang</h1>
    <p>Landing page ini di-deploy otomatis dengan CI/CD</p>
    <a class="tombol" href="#tentang">Pelajari Lebih Lanjut</a>
  </header>

  <section id="tentang">
    <h2>Tentang Proyek Ini</h2>
    <p>
      Halaman ini dideploy ke server DigitalOcean menggunakan
      GitHub Actions. Setiap kali kode di-push ke GitHub,
      website akan terupdate secara otomatis.
    </p>
  </section>

  <footer>
    Dibuat oleh Annisa Lathifa - Versi 1
  </footer>
</body>
</html>
